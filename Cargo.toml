[package]
name = "trenchers-arena-backend"
version = "0.1.0"
edition = "2021"
description = "Backend for the Trenchers Arena mobile app: a gateway to its platform and indexer APIs"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
