[package]
name = "trenchers-arena-backend"
version = "0.1.0"
edition = "2021"
# The floor set by the locked dependency tree (the icu crates under `url`).
rust-version = "1.88"
description = "Backend for the Trenchers Arena mobile app: a gateway to its platform and indexer APIs"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
bs58 = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", default-features = false, features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1"

[dev-dependencies]
# `oneshot` for the route-precedence unit test.
tower = { version = "0.5", default-features = false, features = ["util"] }
wiremock = "0.6"
